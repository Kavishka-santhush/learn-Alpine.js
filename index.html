<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine.js Advanced - Persist, x-init, x-ref</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js Persist Plugin (Must be loaded BEFORE core Alpine) -->
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.x.x/dist/cdn.min.js"></script>
    <!-- Alpine.js Core CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 transition-colors duration-300">

    <!-- Main Container -->
    <div x-data="{ 
            // $persist මඟින් මේක browser එකේ localStorage එකේ සේව් වෙනවා (Refresh කළත් මකෙන්නේ නැහැ)
            darkMode: $persist(false),
            name: $persist(''),
            
            init() {
                console.log('Alpine component එක සාර්ථකව Load විය!');
            },

            focusInput() {
                // x-ref මඟින් input එක අල්ලාගෙන ඒකට focus කරයි
                this.$refs.myInput.focus();
            }
         }" 
         x-init="init()"
         :class="darkMode ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-800'"
         class="flex items-center justify-center h-screen transition-colors duration-300">

        <div :class="darkMode ? 'bg-gray-800 border-gray-700 text-white' : 'bg-white border-gray-200 text-gray-800'"
             class="p-8 rounded-xl shadow-md w-96 border transition-colors duration-300">
            
            <h1 class="text-2xl font-bold mb-4 text-center">Advanced Alpine.js</h1>

            <!-- Dark Mode Toggle with Persist -->
            <div class="mb-6 text-center">
                <button @click="darkMode = !darkMode" 
                        :class="darkMode ? 'bg-yellow-500 hover:bg-yellow-400 text-gray-900' : 'bg-gray-900 hover:bg-gray-800 text-white'"
                        class="w-full px-4 py-2.5 rounded-lg font-semibold transition shadow cursor-pointer">
                    <span x-text="darkMode ? '☀️ Light Mode වෙත මාරු වන්න' : '🌙 Dark Mode වෙත මාරු වන්න'"></span>
                </button>
            </div>

            <!-- x-ref Example -->
            <div class="mb-4">
                <label class="block text-sm font-bold mb-2">ඔබේ නම (Persisted & Ref):</label>
                <!-- x-ref="myInput" මඟින් මෙම input එක නම් කර ඇත -->
                <input type="text" x-model="name" x-ref="myInput" placeholder="නමක් ටයිප් කරන්න..." 
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800">
            </div>

            <!-- Focus Button using x-ref -->
            <button @click="focusInput()" 
                class="bg-blue-600 hover:bg-blue-700 text-white w-full py-2 rounded-lg font-medium transition cursor-pointer mb-4">
                Input එකට Focus කරන්න
            </button>

            <!-- Live Output -->
            <div class="p-3 rounded-lg border text-sm" :class="darkMode ? 'bg-gray-700 border-gray-600' : 'bg-gray-50 border-gray-200'">
                <p>សួស្តီ (Hello), <span class="font-bold text-blue-400" x-text="name ? name : 'මිත්‍රයා'"></span>!</p>
                <p class="text-xs opacity-75 mt-1">💡 සටහන: පිටුව (Refresh) කළත් නම සහ Dark Mode එක මැකී යන්නේ නැත ($persist නිසා).</p>
            </div>

        </div>
    </div>

</body>
</html>
