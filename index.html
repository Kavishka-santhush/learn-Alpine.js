<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine.js Tutorial - Step 4</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-xl shadow-md w-96">
        <h1 class="text-2xl font-bold mb-4 text-gray-800 text-center">Alpine.js Step 4</h1>

        <!-- Alpine Component Starts Here -->
        <div x-data="{ 
            username: '', 
            isSubscribed: false,
            selectedRole: 'Developer'
        }">
            
            <!-- Text Input with x-model -->
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">ඔබේ නම:</label>
                <input type="text" x-model="username" placeholder="නමක් ටයිප් කරන්න..." 
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Checkbox with x-model -->
            <div class="mb-4 flex items-center">
                <input type="checkbox" id="sub" x-model="isSubscribed" class="w-4 h-4 text-blue-600 rounded">
                <label for="sub" class="ml-2 text-gray-700 text-sm">නවුස්ලෙටර් එක ලබා ගන්න</label>
            </div>

            <!-- Select Dropdown with x-model -->
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">භූමිකාව (Role):</label>
                <select x-model="selectedRole" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="Developer">Developer</option>
                    <option value="Designer">Designer</option>
                    <option value="Manager">Manager</option>
                </select>
            </div>

            <!-- Live Output Display -->
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                <h3 class="font-bold text-gray-700 mb-2">තත්‍ය කාලීන දත්ත (Live Data):</h3>
                <p class="text-sm text-gray-600">නම: <span class="font-semibold text-blue-600" x-text="username ? username : 'සටහන් කර නැත'"></span></p>
                <p class="text-sm text-gray-600">දායකත්වය: <span class="font-semibold" x-text="isSubscribed ? 'ඔව් (Subscribed)' : 'නැත (Not Subscribed)'"></span></p>
                <p class="text-sm text-gray-600">තෝරාගත් භූමිකාව: <span class="font-semibold text-indigo-600" x-text="selectedRole"></span></p>
            </div>

        </div>
        <!-- Alpine Component Ends Here -->

    </div>

</body>
</html>
