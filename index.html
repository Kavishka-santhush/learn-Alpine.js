<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine.js Framework Architecture</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js Core (type="module" හරහා js/app.js ලෝඩ් වේ) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script type="module" src="./js/app.js"></script>
</head>
<body class="transition-colors duration-300" :class="$store.appState.theme === 'dark' ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-800'">

    <div class="flex flex-col items-center justify-center h-screen gap-6">

        <!-- Global Theme Control Header -->
        <div class="p-4 rounded-xl shadow border w-96 text-center" :class="$store.appState.theme === 'dark' ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'">
            <h1 class="text-xl font-bold mb-2" x-text="$store.appState.appName"></h1>
            <button @click="$store.appState.toggleTheme()" class="px-3 py-1.5 rounded bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium transition cursor-pointer">
                Theme මාරු කරන්න (<span x-text="$store.appState.theme"></span>)
            </button>
        </div>

        <!-- Component 1: Counter (counterData මඟින් පාලනය වේ) -->
        <div x-data="counterData" class="p-6 rounded-xl shadow border w-96 text-center" :class="$store.appState.theme === 'dark' ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'">
            <h2 class="text-lg font-semibold mb-3">ගණක යන්ත්‍රය (Counter Component)</h2>
            <p class="text-3xl font-bold text-blue-500 mb-4" x-text="count"></p>
            <div class="flex justify-center gap-2">
                <button @click="increment()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-medium cursor-pointer">Plus (+)</button>
                <button @click="decrement()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-medium cursor-pointer">Minus (-)</button>
            </div>
        </div>

        <!-- Component 2: User Profile (userData මඟින් පාලනය වේ) -->
        <div x-data="userData" class="p-6 rounded-xl shadow border w-96 text-center" :class="$store.appState.theme === 'dark' ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'">
            <h2 class="text-lg font-semibold mb-3">පරිශීලක පැතිකඩ (User Component)</h2>
            <p class="text-md mb-3">නම: <span class="font-bold text-indigo-400" x-text="username"></span></p>
            
            <template x-if="!isEditing">
                <button @click="isEditing = true" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-medium cursor-pointer">නම වෙනස් කරන්න</button>
            </template>

            <template x-if="isEditing">
                <div class="space-y-2">
                    ახალი නම: <input type="text" x-ref="newName" class="border px-2 py-1 rounded w-full text-center text-gray-800" placeholder="නමක් ලියන්න...">
                    <button @click="saveUser($refs.newName.value)" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded text-sm cursor-pointer">සුරකින්න</button>
                </div>
            </template>
        </div>

    </div>

</body>
</html>
