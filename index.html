<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine.js Tutorial - Step 3</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-xl shadow-md w-96">
        <h1 class="text-2xl font-bold mb-4 text-gray-800 text-center">Alpine.js Step 3</h1>

        <!-- Alpine Component Starts Here -->
        <div x-data="{ 
            showAlert: true, 
            todos: ['ඇඳුම් සෝදා ගැනීම', 'Alpine.js ඉගෙනීම', 'කෝපි බීම'] 
        }">
            
            <!-- Toggle Button for x-show -->
            <button @click="showAlert = !showAlert" class="bg-purple-500 hover:bg-purple-600 text-white w-full py-2 rounded-lg font-medium transition mb-4">
                <span x-text="showAlert ? 'သတိပေးවීම සඟවන්න' : 'သတိပေးවීම පෙන්වන්න'"></span>
            </button>

            <!-- x-show Example (Toggles display: none) -->
            <div x-show="showAlert" class="bg-blue-100 border-l-4 border-blue-500 text-blue-700 p-3 mb-4 rounded">
                <p class="font-bold">ማስታወሻ (Notice):</p>
                <p class="text-sm">මෙය `x-show` මඟින් පාලනය වන කොටසකි!</p>
            </div>

            <!-- x-for Example (Loops through an array) -->
            <h3 class="font-bold text-gray-700 mb-2">කළ යුතු දේවල් (To-Do List):</h3>
            <ul class="list-disc list-inside space-y-1 text-gray-600">
                <template x-for="todo in todos">
                    <li x-text="todo"></li>
                </template>
            </ul>

        </div>
        <!-- Alpine Component Ends Here -->

    </div>

</body>
</html>
